name: Homework 4

on: [push]

jobs:

  build:

    name: Racket
    runs-on: ubuntu-slim
    timeout-minutes: 20

    steps:
    - name: Clone repository
      uses: actions/checkout@master
    - name: Install Racket
      uses: bogdanp/setup-racket@v1.15
      with:
        architecture: 'x64'
        distribution: 'full'
        variant: 'CS'
        version: '8.9'
    - name: Run test cases
      run: raco test src/hw4-test.rkt
